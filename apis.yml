name: Google Cloud AutoML
description: >-
  Google Cloud AutoML enables developers with limited machine learning expertise
  to train high-quality custom models. It provides a suite of products for
  training custom ML models for translation, natural language, vision, video
  intelligence, and tabular data using transfer learning and neural architecture
  search.
